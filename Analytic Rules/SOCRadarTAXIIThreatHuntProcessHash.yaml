id: a3c7e1b5-9d20-4f68-8b14-7e6d0a2c9f66
name: SOCRadar TAXII Threat Hunt - Process started from a known hash
description: |
  Correlates process creation events (ASIM _Im_ProcessEvent filtered to ProcessCreated, TargetProcessSHA256, TargetProcessSHA1 and TargetProcessMD5) with active file hash indicators that the SOCRadar TAXII 2.1 Function App wrote to ThreatIntelIndicators. Recorded Future has no process rule. One alert per matching process.
severity: Medium
requiredDataConnectors:
  - connectorId: ThreatIntelligenceUploadIndicatorsAPI
    dataTypes:
      - ThreatIntelIndicators
queryFrequency: 1h
queryPeriod: 14d
triggerOperator: gt
triggerThreshold: 0
tactics:
  - Execution
  - DefenseEvasion
relevantTechniques:
  - T1204
  - T1036
customDetails:
  SOCRadarCollection: Collection
  SOCRadarConfidence: Confidence
  SOCRadarValidUntil: ValidUntil
  SOCRadarIndicatorId: IndicatorId
  SOCRadarThreatLabels: ThreatLabels
  SourceProduct: SourceProduct
  ProcessCommandLine: ProcessCommandLine
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: 1h
    matchingMethod: AllEntities
eventGroupingSettings:
  aggregationKind: AlertPerResult
alertDetailsOverride:
  alertDisplayNameFormat: 'SOCRadar TAXII {{IndicatorType}} match: {{MatchedValue}}'
  alertDescriptionFormat: "The SOCRadar TAXII feed lists {{MatchedValue}} ({{IndicatorType}}); it was seen in {{SourceProduct}} telemetry. Confidence, validity, threat labels and collection are in the custom details."
  alertDynamicProperties:
    - alertProperty: AlertLink
      value: LinkToSOCRadar
    - alertProperty: ProviderName
      value: ProviderName
query: |
  let dt_lookBack = 2h;
  let ioc_lookBack = 14d;
  let Indicators = ThreatIntelIndicators
  | where SourceSystem == "SOCRadar TAXII"
  | where ObservableKey in ("file:hashes.sha256", "file:hashes.sha1", "file:hashes.md5")
  | where isnotempty(ObservableValue)
  | where TimeGenerated >= ago(ioc_lookBack)
  | summarize arg_max(TimeGenerated, *) by Id
  | where IsActive == true and ValidUntil > now()
  | summarize arg_max(TimeGenerated, *) by ObservableValue
  | extend Collection = extract(@"collection-([0-9a-fA-F-]{36})", 1, tostring(Tags))
  | extend ThreatLabels = strcat_array(set_difference(split(tostring(Tags), ","), dynamic(["socradar", "taxii"]), pack_array(strcat("collection-", Collection))), ", ")
  | project IndicatorId = Id, MatchedValue = ObservableValue, MatchKey = tolower(ObservableValue), IndicatorKey = ObservableKey, Confidence, ValidUntil, Collection, ThreatLabels;
  _Im_ProcessEvent(starttime = ago(dt_lookBack), eventtypefilter = "ProcessCreated")
  | where TimeGenerated >= ago(dt_lookBack)
  | extend HashList = pack_array(TargetProcessSHA256, TargetProcessSHA1, TargetProcessMD5)
  | mv-expand EventHash = HashList to typeof(string)
  | where isnotempty(EventHash)
  | extend EventHashLower = tolower(EventHash)
  | join kind=inner Indicators on $left.EventHashLower == $right.MatchKey
  | extend IndicatorType = case(IndicatorKey == "file:hashes.sha256", "SHA256 process hash", IndicatorKey == "file:hashes.sha1", "SHA1 process hash", "MD5 process hash")
  | extend HashAlgorithm = case(IndicatorKey == "file:hashes.sha256", "SHA256", IndicatorKey == "file:hashes.sha1", "SHA1", "MD5")
  | extend HostName = DvcHostname, ProcessName = TargetProcessName, ProcessCommandLine = TargetProcessCommandLine, AccountName = coalesce(ActorUsername, TargetUsername), SourceProduct = EventProduct
  | extend LinkToSOCRadar = "https://platform.socradar.com", ProviderName = "SOCRadar"
  | project TimeGenerated, IndicatorType, MatchedValue, HashAlgorithm, IndicatorId, Confidence, ValidUntil, Collection, ThreatLabels, ProcessName, ProcessCommandLine, AccountName, HostName, SourceProduct, LinkToSOCRadar, ProviderName
entityMappings:
  - entityType: FileHash
    fieldMappings:
      - identifier: Algorithm
        columnName: HashAlgorithm
      - identifier: Value
        columnName: MatchedValue
  - entityType: File
    fieldMappings:
      - identifier: Name
        columnName: ProcessName
  - entityType: Account
    fieldMappings:
      - identifier: Name
        columnName: AccountName
  - entityType: Host
    fieldMappings:
      - identifier: HostName
        columnName: HostName
version: 1.0.0
kind: Scheduled
