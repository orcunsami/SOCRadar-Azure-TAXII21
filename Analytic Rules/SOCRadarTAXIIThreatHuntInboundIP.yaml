id: c4a3f7e8-52a1-4d3b-8c9e-6a1b0f7d2e22
name: SOCRadar TAXII Threat Hunt - Inbound connection from IP address
description: |
  Correlates allowed inbound network sessions (ASIM _Im_NetworkSession, SrcIpAddr) with active IP indicators that the SOCRadar TAXII 2.1 Function App wrote to ThreatIntelIndicators. Sessions the device denied or dropped are ignored. Recorded Future rules look at the destination only.
severity: Medium
requiredDataConnectors:
  - connectorId: ThreatIntelligenceUploadIndicatorsAPI
    dataTypes:
      - ThreatIntelIndicators
queryFrequency: 1h
queryPeriod: 14d
triggerOperator: gt
triggerThreshold: 0
tactics:
  - InitialAccess
  - Reconnaissance
relevantTechniques:
  - T1190
  - T1595
customDetails:
  SOCRadarCollection: Collection
  SOCRadarConfidence: Confidence
  SOCRadarValidUntil: ValidUntil
  SOCRadarIndicatorId: IndicatorId
  SOCRadarThreatLabels: ThreatLabels
  SourceProduct: SourceProduct
  EventKey: EventKey
incidentConfiguration:
  createIncident: true
  groupingConfiguration:
    enabled: true
    reopenClosedIncident: false
    lookbackDuration: 1h
    matchingMethod: AllEntities
eventGroupingSettings:
  aggregationKind: AlertPerResult
alertDetailsOverride:
  alertDisplayNameFormat: 'SOCRadar TAXII {{IndicatorType}} match: {{MatchedValue}}'
  alertDescriptionFormat: "The SOCRadar TAXII feed lists {{MatchedValue}} ({{IndicatorType}}); it was seen in {{SourceProduct}} telemetry. Confidence, validity, threat labels and collection are in the custom details."
  alertDynamicProperties:
    - alertProperty: AlertLink
      value: LinkToSOCRadar
    - alertProperty: ProviderName
      value: ProviderName
query: |
  let dt_lookBack = 2h;
  let ioc_lookBack = 14d;
  let alerted = SecurityAlert
  | where TimeGenerated > ago(4h)
  | where tostring(parse_json(ExtendedProperties)["Analytic Rule Name"]) == "SOCRadar TAXII Threat Hunt - Inbound connection from IP address"
  | extend EventKey = tostring(parse_json(tostring(parse_json(ExtendedProperties)["Custom Details"])).EventKey[0])
  | distinct EventKey;
  let Indicators = ThreatIntelIndicators
  | where SourceSystem == "SOCRadar TAXII"
  | where ObservableKey == "ipv4-addr:value"
  | where isnotempty(ObservableValue)
  | where TimeGenerated >= ago(ioc_lookBack)
  | summarize arg_max(TimeGenerated, *) by Id
  | where IsActive == true and ValidUntil > now()
  | summarize arg_max(TimeGenerated, *) by ObservableValue
  | extend Collection = extract(@"collection-([0-9a-fA-F-]{36})", 1, tostring(Tags))
  | extend ThreatLabels = strcat_array(set_difference(split(tostring(Tags), ","), dynamic(["socradar", "taxii"]), pack_array(strcat("collection-", Collection))), ", ")
  | project IndicatorId = Id, MatchedValue = ObservableValue, MatchKey = tolower(ObservableValue), IndicatorKey = ObservableKey, Confidence, ValidUntil, Collection, ThreatLabels;
  _Im_NetworkSession(starttime = ago(dt_lookBack))
  | where TimeGenerated >= ago(dt_lookBack)
  | where isnotempty(SrcIpAddr)
  | where isempty(DvcAction) or DvcAction =~ "Allow"
  | join kind=inner Indicators on $left.SrcIpAddr == $right.MatchKey
  | extend IndicatorType = "Inbound IP address", InternalIp = DstIpAddr, HostName = coalesce(DstHostname, DvcHostname), SourceProduct = EventProduct
  | extend LinkToSOCRadar = "https://platform.socradar.com", ProviderName = "SOCRadar"
  | extend EventKey = strcat(MatchedValue, "|", HostName, "|", tostring(TimeGenerated))
  | where EventKey !in (alerted)
  | project TimeGenerated, EventKey, IndicatorType, MatchedValue, IndicatorId, Confidence, ValidUntil, Collection, ThreatLabels, InternalIp, HostName, SourceProduct, LinkToSOCRadar, ProviderName
entityMappings:
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: MatchedValue
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: InternalIp
  - entityType: Host
    fieldMappings:
      - identifier: HostName
        columnName: HostName
version: 1.0.0
kind: Scheduled
