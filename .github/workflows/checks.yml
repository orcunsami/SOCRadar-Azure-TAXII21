name: Checks

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Every tracked JSON parses
        run: |
          set -e
          count=0
          while IFS= read -r f; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f"
            echo "  ok: $f"
            count=$((count + 1))
          done < <(git ls-files '*.json')
          echo "checked $count file(s)"
          # A glob that matches nothing would otherwise pass silently.
          if [ "$count" -lt 2 ]; then
            echo "expected at least 2 JSON file(s), found $count"
            exit 1
          fi
        shell: bash

      - name: Template and package checks
        run: python3 tests/run_all.py

      - name: No secrets in tracked files
        run: |
          set -e
          # Calibrate first: a scan that cannot see a planted probe proves nothing.
          # The probe strings are assembled at run time so this file does not trip its own scan.
          printf 'api_key = "sk-%s"\nAKIA%s\n' "CALIBRATION0123456789012" "0000CALIBRATION1" > .calibration-probe
          if ! grep -rIE 'sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}' . --exclude-dir=.git >/dev/null; then
            echo "scan is blind - it cannot see the calibration probe"
            rm -f .calibration-probe
            exit 1
          fi
          rm -f .calibration-probe
          # SOCRadar API keys are 64 hex characters; calibrate that pattern on its own.
          printf 'key = "%s"\n' "$(printf 'ab%.0s' $(seq 1 32))" > .calibration-probe
          if ! grep -rIE '\b[0-9a-fA-F]{64}\b' . --exclude-dir=.git >/dev/null; then
            echo "scan is blind to 64-hex keys - it cannot see the calibration probe"
            rm -f .calibration-probe
            exit 1
          fi
          rm -f .calibration-probe
          echo "  calibration ok"
          if grep -rIE 'sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|\b[0-9a-fA-F]{64}\b|-----BEGIN [A-Z ]*PRIVATE KEY-----' . --exclude-dir=.git; then
            echo "secret pattern found in tracked content"
            exit 1
          fi
          echo "  no secret patterns"
